<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Proyecto conceptual: nada se indexa (netlify.toml también envía X-Robots-Tag: noindex) -->
    <meta name="robots" content="noindex" />
    <title>Casa Alcanfor · Jardín &amp; Salón de Eventos en Zapopan</title>
    <meta
      name="description"
      content="Jardín y salón en Zapopan para bodas, XV años, bautizos y eventos corporativos. Hasta 450 invitados, precio cerrado y coordinador dedicado."
    />

    <!-- Íconos (pnpm icons los regenera desde el monograma del Logo) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- --color-surface (ivory-50): la barra del navegador continúa el fondo del header -->
    <meta name="theme-color" content="#f7f2ea" />

    <!-- Open Graph. og:url y canonical los agrega el build solo si hay VITE_SITE_URL, que además vuelve
         absoluta la ruta de og:image y twitter:image (vite.config.ts). La imagen es un diseño propio, no se genera. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:site_name" content="Casa Alcanfor" />
    <meta property="og:title" content="Casa Alcanfor · Jardín &amp; Salón de Eventos en Zapopan" />
    <meta
      property="og:description"
      content="Jardín y salón en Zapopan para bodas, XV años, bautizos y eventos corporativos. Hasta 450 invitados, precio cerrado y coordinador dedicado."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sobre fondo verde oscuro, Casa Alcanfor, Jardín &amp; Salón de Eventos, Proyecto conceptual. A la derecha, una laptop con la sección «Tres espacios que se adaptan a tu celebración» y la foto de un salón montado para banquete, y un teléfono con el titular «Celebra donde cada momento se vuelve recuerdo»."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Casa Alcanfor · Jardín &amp; Salón de Eventos en Zapopan" />
    <meta
      name="twitter:description"
      content="Jardín y salón en Zapopan para bodas, XV años, bautizos y eventos corporativos. Hasta 450 invitados, precio cerrado y coordinador dedicado."
    />
    <meta name="twitter:image" content="/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="Sobre fondo verde oscuro, Casa Alcanfor, Jardín &amp; Salón de Eventos, Proyecto conceptual. A la derecha, una laptop con la sección «Tres espacios que se adaptan a tu celebración» y la foto de un salón montado para banquete, y un teléfono con el titular «Celebra donde cada momento se vuelve recuerdo»."
    />

    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="/node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
